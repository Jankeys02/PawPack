name: Release

on:
  push:
    tags: ["v*"]

# Needed by tauri-action to create the release and upload the bundles.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Pull the section for this tag out of CHANGELOG.md so the release notes
      # are the changelog rather than a pointer to it. index() instead of a
      # dynamic regex: the version has dots in it, and building a regex from a
      # shell variable is how that goes wrong quietly.
      - name: Read release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && (/^## / || /^\[[^]]*\]: /) { exit }
            f { print }
          ' CHANGELOG.md)
          # No matching section is not worth failing a release over, but it
          # should be obvious in the draft that the changelog was not updated.
          if [ -z "$(printf %s "$body" | tr -d "[:space:]")" ]; then
            body="No CHANGELOG entry for $version."
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the bundle and the latest.json the in-app updater reads. Without
          # these the release still builds, but every client rejects the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PawPack ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
