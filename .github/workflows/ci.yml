name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    # Windows only: the apply/revert path is Win32 + registry, and its tests go
    # with it. Add other runners when another platform actually ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A release that builds for nine minutes and then fails on the last
          # API call still did nine minutes of useful compiling. Without this,
          # that work is thrown away and the retry starts cold.
          cache-on-failure: true

      - run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
